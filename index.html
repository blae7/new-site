<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Compass — Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --accent: #007AFF;
    --red: #FF3B30;
    --card: rgba(255,255,255,0.78);
    --card-solid: #ffffff;
    --line: rgba(60,60,67,0.15);
    --text: #1C1C1E;
    --dim: #8E8E93;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    color: var(--text);
  }
  #map{ position:fixed; inset:0; z-index:1; }
  .leaflet-control-attribution{ font-size:9px !important; opacity:0.6; }
  .leaflet-control-zoom{ display:none; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 8px 30px rgba(0,0,0,0.14);
  }

  /* ---------- search bar ---------- */
  .search-wrap{
    position:fixed; z-index: 20;
    top: max(16px, env(safe-area-inset-top));
    left:16px; right:16px;
    max-width: 420px;
  }
  .search-bar{
    display:flex; align-items:center; gap:8px;
    border-radius: 16px;
    padding: 12px 14px;
  }
  .search-bar svg{ flex-shrink:0; opacity:0.55; }
  .search-bar input{
    border:none; outline:none; background:transparent;
    font-size:1rem; font-family:inherit; flex:1; color:var(--text);
  }
  .search-bar input::placeholder{ color: var(--dim); }
  .clear-btn{
    display:none; width:20px; height:20px; border-radius:50%;
    background: var(--dim); color:#fff; border:none; font-size:0.7rem;
    align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .clear-btn.show{ display:flex; }

  .suggestions{
    margin-top:8px; border-radius:16px; overflow:hidden; max-height: 50vh; overflow-y:auto;
    display:none;
  }
  .suggestions.show{ display:block; }
  .sugg-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .sugg-item:last-child{ border-bottom:none; }
  .sugg-item:active{ background: rgba(0,0,0,0.04); }
  .sugg-icon{
    width:32px; height:32px; border-radius:50%; background: var(--dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff;
  }
  .sugg-text .name{ font-size:0.92rem; font-weight:600; }
  .sugg-text .addr{ font-size:0.78rem; color:var(--dim); }
  .sugg-empty{ padding:16px; font-size:0.85rem; color:var(--dim); text-align:center; }
  .sugg-label{ padding:10px 14px 4px; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--dim); }

  /* ---------- right side controls ---------- */
  .side-controls{
    position:fixed; z-index:20; right:16px; bottom: max(120px, calc(28vh)); /* repositioned dynamically for sheet */
    display:flex; flex-direction:column; gap:10px;
    transition: bottom 0.35s cubic-bezier(.25,1,.5,1);
  }
  .ctrl-btn{
    width:44px; height:44px; border-radius:14px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color: var(--text);
  }
  .ctrl-btn.locate{ color: var(--accent); }
  .ctrl-stack{ border-radius:14px; overflow:hidden; }
  .ctrl-stack .ctrl-btn{ border-radius:0; }
  .ctrl-stack .ctrl-btn + .ctrl-btn{ border-top:1px solid var(--line); }

  /* ---------- bottom sheet ---------- */
  .sheet{
    position:fixed; z-index:25; left:0; right:0; bottom:0;
    border-radius: 22px 22px 0 0;
    padding: 10px 18px max(20px, env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform 0.4s cubic-bezier(.25,1,.5,1);
    max-height: 46vh;
    overflow-y:auto;
  }
  .sheet.show{ transform: translateY(0); }
  .sheet-handle{ width:36px; height:5px; border-radius:3px; background: var(--line); margin: 4px auto 14px; }
  .sheet-title{ font-size:1.3rem; font-weight:700; margin:0 0 2px; }
  .sheet-sub{ font-size:0.85rem; color:var(--dim); margin-bottom:16px; }
  .sheet-actions{ display:flex; gap:10px; margin-bottom: 6px; flex-wrap:wrap; }
  .action-btn{
    flex:1; min-width:84px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background: rgba(118,118,128,0.08); border:none; border-radius:14px;
    padding: 12px 8px; cursor:pointer; color: var(--text); font-size:0.72rem; font-weight:600;
  }
  .action-btn .circle{
    width:38px; height:38px; border-radius:50%; background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .action-btn.close .circle{ background: var(--dim); }
  .route-info{
    display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
    align-items:center; justify-content:space-between;
  }
  .route-info.show{ display:flex; }
  .route-info .big{ font-size:1.6rem; font-weight:700; color: var(--accent); }
  .route-info .small{ font-size:0.8rem; color:var(--dim); }
  .end-route{
    background: rgba(255,59,48,0.12); color: var(--red); border:none;
    border-radius:12px; padding:9px 14px; font-size:0.78rem; font-weight:600; cursor:pointer;
  }

  /* ---------- recents / empty state ---------- */
  .recents-panel{ padding: 4px 0 8px; }

  /* ---------- markers ---------- */
  .pin{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .user-dot{
    width:16px; height:16px; border-radius:50%;
    background: var(--accent); border:3px solid #fff;
    box-shadow: 0 0 0 2px rgba(0,122,255,0.4);
    position:relative;
  }
  .user-dot::after{
    content:''; position:absolute; inset:-14px; border-radius:50%;
    background: rgba(0,122,255,0.18);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{ 0%{ transform:scale(0.4); opacity:0.9; } 100%{ transform:scale(1.6); opacity:0; } }

  .boot{
    position:fixed; inset:0; z-index:100; background:#fff;
    display:flex; align-items:center; justify-content:center;
    transition: opacity 0.5s ease;
  }
  .boot p{ color: var(--dim); font-size:0.85rem; }
</style>
</head>
<body>

<div class="boot" id="boot"><p>Loading map…</p></div>
<div id="map"></div>

<div class="search-wrap">
  <div class="search-bar glass">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#1C1C1E" stroke-width="2"/><path d="M21 21l-4-4" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Search Maps" autocomplete="off">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="suggestions glass" id="suggestions"></div>
</div>

<div class="side-controls" id="sideControls">
  <div class="ctrl-stack glass">
    <button class="ctrl-btn" id="zoomIn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#1C1C1E" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="ctrl-btn" id="zoomOut">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="#1C1C1E" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <button class="ctrl-btn glass" id="layerBtn" title="Change map style">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2l9 5-9 5-9-5 9-5z" stroke="#1C1C1E" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5" stroke="#1C1C1E" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </button>
  <button class="ctrl-btn glass locate" id="locateBtn" title="My location">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#007AFF"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="#007AFF" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="sheet glass" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">Place</div>
  <div class="sheet-sub" id="sheetSub">Address</div>
  <div class="sheet-actions">
    <button class="action-btn" id="btnDirections">
      <div class="circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 16-3-7-7-1z" fill="#fff"/></svg></div>
      Directions
    </button>
    <button class="action-btn" id="btnSave">
      <div class="circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.6-9.5-9C1 8 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6 4 4.5 8-2.5 4.4-9.5 9-9.5 9z" fill="#fff"/></svg></div>
      Save
    </button>
    <button class="action-btn" id="btnShare">
      <div class="circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="2.4" stroke="#fff" stroke-width="1.8"/><circle cx="6" cy="12" r="2.4" stroke="#fff" stroke-width="1.8"/><circle cx="18" cy="19" r="2.4" stroke="#fff" stroke-width="1.8"/><path d="M8.2 10.8L16 6.2M8.2 13.2L16 17.8" stroke="#fff" stroke-width="1.6"/></svg></div>
      Share
    </button>
    <button class="action-btn close" id="btnClose">
      <div class="circle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      Close
    </button>
  </div>
  <div class="route-info" id="routeInfo">
    <div>
      <div class="big" id="routeTime">--</div>
      <div class="small" id="routeDist">--</div>
    </div>
    <button class="end-route" id="endRoute">End Route</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  const NYC = [40.7128, -74.0060];
  const RECENTS_KEY = 'compass-recents-v1';

  const map = L.map('map', { zoomControl:false, attributionControl:true }).setView(NYC, 13);

  const layers = {
    standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap contributors', maxZoom:19 }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Tiles © Esri', maxZoom:19 }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution:'© OpenStreetMap © CARTO', maxZoom:19, subdomains:'abcd' })
  };
  const layerOrder = ['standard','satellite','dark'];
  let layerIdx = 0;
  layers.standard.addTo(map);

  document.getElementById('layerBtn').addEventListener('click', () => {
    map.removeLayer(layers[layerOrder[layerIdx]]);
    layerIdx = (layerIdx + 1) % layerOrder.length;
    layers[layerOrder[layerIdx]].addTo(map);
  });

  document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());
  document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());

  // ---------------- pins ----------------
  const pinSVG = (color) => `
    <svg width="30" height="38" viewBox="0 0 30 38" fill="none">
      <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 23 15 23s15-12.5 15-23C30 6.7 23.3 0 15 0z" fill="${color}"/>
      <circle cx="15" cy="15" r="6" fill="white"/>
    </svg>`;
  const searchIcon = L.divIcon({ html: pinSVG('#FF3B30'), className:'pin', iconSize:[30,38], iconAnchor:[15,36] });
  const userIcon = L.divIcon({ html: '<div class="user-dot"></div>', className:'pin', iconSize:[16,16], iconAnchor:[8,8] });

  let searchMarker = null;
  let userMarker = null;
  let userLatLng = null;
  let routeLine = null;
  let activePlace = null;

  function placeMarker(lat, lon){
    if(searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker([lat, lon], { icon: searchIcon }).addTo(map);
  }

  // ---------------- sheet ----------------
  const sheet = document.getElementById('sheet');
  const sideControls = document.getElementById('sideControls');
  function openSheet(title, sub){
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetSub').textContent = sub;
    sheet.classList.add('show');
    sideControls.style.bottom = '42vh';
    document.getElementById('routeInfo').classList.remove('show');
  }
  function closeSheet(){
    sheet.classList.remove('show');
    sideControls.style.bottom = 'max(120px, calc(28vh))';
    if(searchMarker){ map.removeLayer(searchMarker); searchMarker = null; }
    if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
    activePlace = null;
  }
  document.getElementById('btnClose').addEventListener('click', closeSheet);

  // ---------------- recents ----------------
  function getRecents(){
    try{ return JSON.parse(localStorage.getItem(RECENTS_KEY)) || []; }catch(e){ return []; }
  }
  function addRecent(place){
    let recents = getRecents().filter(r => r.display !== place.display);
    recents.unshift(place);
    recents = recents.slice(0, 8);
    localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
  }

  function selectPlace(place, fromInteraction){
    activePlace = place;
    map.flyTo([place.lat, place.lon], 15, { duration: 0.9 });
    placeMarker(place.lat, place.lon);
    openSheet(place.name, place.display);
    if(fromInteraction) addRecent(place);
    hideSuggestions();
    searchInput.value = place.name;
    clearBtn.classList.add('show');
  }

  // ---------------- search ----------------
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const suggestionsEl = document.getElementById('suggestions');
  let searchTimer = null;

  function hideSuggestions(){ suggestionsEl.classList.remove('show'); suggestionsEl.innerHTML=''; }

  function renderRecents(){
    const recents = getRecents();
    if(recents.length === 0){ hideSuggestions(); return; }
    suggestionsEl.innerHTML = '<div class="sugg-label">Recents</div>' + recents.map((r, i) => `
      <div class="sugg-item" data-idx="${i}">
        <div class="sugg-icon">🕘</div>
        <div class="sugg-text"><div class="name">${r.name}</div><div class="addr">${r.display}</div></div>
      </div>`).join('');
    suggestionsEl.classList.add('show');
    suggestionsEl.querySelectorAll('.sugg-item').forEach(el => {
      el.addEventListener('click', () => selectPlace(recents[+el.dataset.idx], true));
    });
  }

  async function runSearch(q){
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if(!data.length){
        suggestionsEl.innerHTML = '<div class="sugg-empty">No results found</div>';
        suggestionsEl.classList.add('show');
        return;
      }
      const places = data.map(d => ({
        name: (d.display_name || '').split(',')[0],
        display: d.display_name,
        lat: parseFloat(d.lat), lon: parseFloat(d.lon)
      }));
      suggestionsEl.innerHTML = places.map((p, i) => `
        <div class="sugg-item" data-idx="${i}">
          <div class="sugg-icon">📍</div>
          <div class="sugg-text"><div class="name">${p.name}</div><div class="addr">${p.display}</div></div>
        </div>`).join('');
      suggestionsEl.classList.add('show');
      suggestionsEl.querySelectorAll('.sugg-item').forEach(el => {
        el.addEventListener('click', () => selectPlace(places[+el.dataset.idx], true));
      });
    }catch(e){
      suggestionsEl.innerHTML = '<div class="sugg-empty">Search unavailable — check connection</div>';
      suggestionsEl.classList.add('show');
    }
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearBtn.classList.toggle('show', q.length > 0);
    clearTimeout(searchTimer);
    if(q.length === 0){ renderRecents(); return; }
    searchTimer = setTimeout(() => runSearch(q), 420);
  });
  searchInput.addEventListener('focus', () => { if(searchInput.value.trim()==='') renderRecents(); });
  clearBtn.addEventListener('click', () => { searchInput.value=''; clearBtn.classList.remove('show'); hideSuggestions(); });

  // ---------------- locate ----------------
  function locateUser(onDone){
    if(!navigator.geolocation){ alert('Location is not available on this browser.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      if(userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(userLatLng, { icon: userIcon }).addTo(map);
      if(onDone) onDone();
    }, () => {
      alert('Could not get your location. Check Safari location permissions in Settings.');
    }, { enableHighAccuracy:true, timeout:8000 });
  }
  document.getElementById('locateBtn').addEventListener('click', () => {
    locateUser(() => map.flyTo(userLatLng, 15, { duration: 0.9 }));
  });

  // ---------------- directions ----------------
  document.getElementById('btnDirections').addEventListener('click', () => {
    if(!activePlace) return;
    if(!userLatLng){
      locateUser(() => getRoute());
    } else {
      getRoute();
    }
  });

  async function getRoute(){
    if(!userLatLng || !activePlace) return;
    try{
      const url = `https://router.project-osrm.org/route/v1/driving/${userLatLng[1]},${userLatLng[0]};${activePlace.lon},${activePlace.lat}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if(!data.routes || !data.routes.length){ alert('No route found.'); return; }
      const route = data.routes[0];
      if(routeLine) map.removeLayer(routeLine);
      routeLine = L.geoJSON(route.geometry, { style: { color:'#007AFF', weight:6, opacity:0.85, lineCap:'round' } }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding:[60,60] });

      const mins = Math.round(route.duration/60);
      const miles = (route.distance/1609.34).toFixed(1);
      document.getElementById('routeTime').textContent = mins + ' min';
      document.getElementById('routeDist').textContent = miles + ' mi drive';
      document.getElementById('routeInfo').classList.add('show');
    }catch(e){
      alert('Directions unavailable right now — check connection.');
    }
  }
  document.getElementById('endRoute').addEventListener('click', () => {
    if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
    document.getElementById('routeInfo').classList.remove('show');
  });

  // ---------------- save / share ----------------
  document.getElementById('btnSave').addEventListener('click', () => {
    if(activePlace){ addRecent(activePlace); document.getElementById('btnSave').querySelector('.circle').style.background = '#34C759'; setTimeout(()=>{ document.getElementById('btnSave').querySelector('.circle').style.background=''; }, 700); }
  });
  document.getElementById('btnShare').addEventListener('click', async () => {
    if(!activePlace) return;
    const url = `https://www.openstreetmap.org/?mlat=${activePlace.lat}&mlon=${activePlace.lon}#map=16/${activePlace.lat}/${activePlace.lon}`;
    if(navigator.share){
      try{ await navigator.share({ title: activePlace.name, text: activePlace.display, url }); }catch(e){}
    } else {
      navigator.clipboard?.writeText(url);
      alert('Link copied to clipboard.');
    }
  });

  // tap on map dismisses suggestions/sheet-lite
  map.on('click', () => hideSuggestions());

  setTimeout(() => {
    const boot = document.getElementById('boot');
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 500);
  }, 350);
})();
</script>
</body>
</html>
