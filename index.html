<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Terraform — Voxel Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #FFB454;
    --panel: rgba(16, 18, 26, 0.68);
    --line: rgba(255,255,255,0.12);
    --text: #F3F2F6;
    --dim: #B7B5C4;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html,body{ margin:0; padding:0; overflow:hidden; height:100%; width:100%;
    font-family:'Space Grotesk', sans-serif; background:#000; color:var(--text); }
  .mono{ font-family:'JetBrains Mono', monospace; }
  canvas{ display:block; touch-action:none; }

  .hud{ position:fixed; z-index:10; pointer-events:none; }
  .panel{
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:16px; pointer-events:all;
  }

  .top{ top: max(16px, env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .title h1{ margin:0; font-size:1.15rem; }
  .title .sub{ font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); }
  .title.panel{ padding:10px 16px; }

  .time-panel{ padding:10px 16px; display:flex; align-items:center; gap:10px; min-width:210px; }
  .time-panel label{ font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .time-panel input[type=range]{ width:120px; accent-color: var(--accent); }
  #hourLabel{ font-size:0.7rem; width:44px; }

  .tools{ position:fixed; top:50%; right:16px; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; }
  .tool-btn{
    width:46px; height:46px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-size:1.1rem; cursor:pointer; backdrop-filter: blur(14px);
  }
  .tool-btn.active{ background: var(--accent); color:#1a1200; border-color:var(--accent); }

  .bottom{ bottom: max(16px, env(safe-area-inset-bottom)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .palette{ display:flex; gap:8px; padding:10px; overflow-x:auto; max-width:78vw; }
  .swatch{
    width:38px; height:38px; border-radius:10px; flex-shrink:0; cursor:pointer;
    border:2px solid transparent; opacity:0.85;
  }
  .swatch.active{ border-color:#fff; opacity:1; transform: translateY(-3px); }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .toolbtn{
    font-family:'JetBrains Mono'; font-size:0.66rem; letter-spacing:0.04em; text-transform:uppercase;
    background: var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:11px 15px; cursor:pointer; backdrop-filter: blur(14px);
  }

  .hint{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    font-size:0.68rem; color:var(--dim); background:var(--panel);
    padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    z-index:10; transition:opacity .5s ease; pointer-events:none; text-align:center;
  }

  .boot{
    position:fixed; inset:0; z-index:100; background:#0a0e18;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    transition:opacity .6s ease;
  }
  .boot p{ font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }
  .boot .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); animation:blink 1s infinite; }
  @keyframes blink{ 0%,100%{opacity:0.2;} 50%{opacity:1;} }
</style>
</head>
<body>

<div class="boot" id="boot"><div class="dot"></div><p>Generating terrain…</p></div>

<div class="hud top">
  <div class="title panel">
    <h1>Terraform</h1>
    <div class="sub">Voxel sandbox</div>
  </div>
  <div class="time-panel panel">
    <label>Time</label>
    <input type="range" id="hour" min="0" max="24" step="0.1" value="12">
    <span id="hourLabel" class="mono">12:00</span>
  </div>
</div>

<div class="hint" id="hint">Tap a block to build · use the erase tool to remove</div>

<div class="tools">
  <button class="tool-btn active" id="modeBuild" title="Build">＋</button>
  <button class="tool-btn" id="modeErase" title="Erase">－</button>
</div>

<div class="hud bottom">
  <div class="palette panel" id="palette"></div>
  <div class="actions">
    <button class="toolbtn panel" id="newWorld">New World</button>
    <button class="toolbtn panel" id="clearWorld">Clear</button>
    <button class="toolbtn panel" id="resetView">Reset View</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const GRID = 18;
  const WATER_LEVEL = 2;
  const STORAGE_KEY = 'terraform-world-v1';

  const BLOCK_TYPES = [
    { name:'Grass', color: 0x5DA84B },
    { name:'Dirt',  color: 0x8B5A2B },
    { name:'Stone', color: 0x8C8C93 },
    { name:'Sand',  color: 0xE8D097 },
    { name:'Wood',  color: 0x7A4B27 },
    { name:'Leaves',color: 0x3F7D32 },
    { name:'Snow',  color: 0xF4F6F8 },
    { name:'Water', color: 0x3FA9F5 }
  ];
  const WATER_TYPE = 7;

  let blocks = new Map();     // key "x,y,z" -> typeIndex
  let seed = Math.random()*1000;
  let currentType = 0;
  let mode = 'build';

  // ---------------- noise ----------------
  function hash(x, z, s){
    let h = Math.sin(x*127.1 + z*311.7 + s*74.7) * 43758.5453;
    return h - Math.floor(h);
  }
  function valueNoise(x, z, s){
    const xi = Math.floor(x), zi = Math.floor(z);
    const xf = x-xi, zf = z-zi;
    const a = hash(xi,zi,s), b = hash(xi+1,zi,s);
    const c = hash(xi,zi+1,s), d = hash(xi+1,zi+1,s);
    const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
    return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
  }
  function fbm(x, z, s){
    let total=0, amp=1, freq=1, maxAmp=0;
    for(let i=0;i<4;i++){
      total += valueNoise(x*freq, z*freq, s+i*13) * amp;
      maxAmp += amp; amp *= 0.5; freq *= 2;
    }
    return total/maxAmp;
  }

  function key(x,y,z){ return x+','+y+','+z; }

  function generateWorld(){
    blocks = new Map();
    const half = GRID/2;
    for(let x=-half; x<half; x++){
      for(let z=-half; z<half; z++){
        const h = Math.max(1, Math.floor(2 + fbm(x*0.15, z*0.15, seed) * 6));
        const isBeach = h <= WATER_LEVEL + 1;
        for(let y=0; y<h; y++){
          let type;
          if(y === h-1) type = isBeach ? 3 : (h >= 7 ? 6 : 0); // sand / snow / grass top
          else if(y > h-3) type = isBeach ? 3 : 1; // dirt near top
          else type = 2; // stone
          blocks.set(key(x,y,z), type);
        }
        // occasional trees on grass, away from water edge, higher ground
        if(!isBeach && h >= 4 && h < 7 && Math.random() < 0.06){
          const trunkH = 2 + Math.floor(Math.random()*2);
          for(let ty=0; ty<trunkH; ty++) blocks.set(key(x,h+ty,z), 4);
          for(let lx=-1; lx<=1; lx++){
            for(let lz=-1; lz<=1; lz++){
              blocks.set(key(x+lx, h+trunkH, z+lz), 5);
            }
          }
          blocks.set(key(x, h+trunkH+1, z), 5);
        }
      }
    }
  }

  function saveWorld(){
    const arr = [];
    blocks.forEach((t, k) => {
      const [x,y,z] = k.split(',').map(Number);
      arr.push([x,y,z,t]);
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ arr, seed, hour: parseFloat(hourSlider.value) }));
  }
  function loadWorld(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      blocks = new Map();
      data.arr.forEach(([x,y,z,t]) => blocks.set(key(x,y,z), t));
      seed = data.seed;
      if(data.hour !== undefined) hourSlider.value = data.hour;
      return true;
    }catch(e){ return false; }
  }

  // ---------------- three.js setup ----------------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
  const defaultCamPos = new THREE.Vector3(GRID*0.9, GRID*0.8, GRID*0.9);
  camera.position.copy(defaultCamPos);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.update();

  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  scene.add(sun);
  scene.add(sun.target);

  const waterPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID+4, GRID+4),
    new THREE.MeshLambertMaterial({ color:0x2E86C1, transparent:true, opacity:0.55 })
  );
  waterPlane.rotation.x = -Math.PI/2;
  waterPlane.position.y = WATER_LEVEL + 0.5;
  scene.add(waterPlane);

  const geo = new THREE.BoxGeometry(1,1,1);
  let instancedMeshes = [];
  let positionsByType = {};

  function rebuildInstances(){
    instancedMeshes.forEach(m => scene.remove(m));
    instancedMeshes = [];
    positionsByType = {};
    BLOCK_TYPES.forEach((bt, typeIdx) => positionsByType[typeIdx] = []);

    blocks.forEach((t, k) => {
      positionsByType[t].push(k.split(',').map(Number));
    });

    BLOCK_TYPES.forEach((bt, typeIdx) => {
      const positions = positionsByType[typeIdx];
      if(positions.length === 0) return;
      const material = new THREE.MeshLambertMaterial({
        color: bt.color,
        transparent: typeIdx === WATER_TYPE,
        opacity: typeIdx === WATER_TYPE ? 0.65 : 1
      });
      const mesh = new THREE.InstancedMesh(geo, material, positions.length);
      mesh.userData.type = typeIdx;
      const m4 = new THREE.Matrix4();
      positions.forEach((p, i) => {
        m4.makeTranslation(p[0]+0.5, p[1]+0.5, p[2]+0.5);
        mesh.setMatrixAt(i, m4);
      });
      mesh.instanceMatrix.needsUpdate = true;
      scene.add(mesh);
      instancedMeshes.push(mesh);
    });
  }

  // ---------------- time of day / sky ----------------
  const skyKeys = [
    { h:0,  sky:0x060714, fog:0x060714, sun:0.02 },
    { h:6,  sky:0xF6A263, fog:0xF6A263, sun:0.5 },
    { h:9,  sky:0x8FCBE8, fog:0x8FCBE8, sun:1.0 },
    { h:15, sky:0x8FCBE8, fog:0x8FCBE8, sun:1.0 },
    { h:18, sky:0xF07E4B, fog:0xF07E4B, sun:0.5 },
    { h:21, sky:0x0C1024, fog:0x0C1024, sun:0.05 },
    { h:24, sky:0x060714, fog:0x060714, sun:0.02 }
  ];
  const cA = new THREE.Color(), cB = new THREE.Color(), out = new THREE.Color();

  function applyTime(hour){
    let lo = skyKeys[0], hi = skyKeys[skyKeys.length-1];
    for(let i=0;i<skyKeys.length-1;i++){
      if(hour >= skyKeys[i].h && hour <= skyKeys[i+1].h){ lo = skyKeys[i]; hi = skyKeys[i+1]; break; }
    }
    const t = (hour - lo.h) / Math.max(0.001, (hi.h - lo.h));
    cA.setHex(lo.sky); cB.setHex(hi.sky);
    out.copy(cA).lerp(cB, t);
    scene.background = out.clone();
    scene.fog = new THREE.Fog(out.getHex(), 30, 90);

    const sunIntensity = lo.sun + (hi.sun - lo.sun) * t;
    sun.intensity = sunIntensity * 1.3;
    ambient.intensity = 0.25 + sunIntensity * 0.35;

    const angle = (hour/24) * Math.PI * 2 - Math.PI/2;
    const R = 40;
    sun.position.set(Math.cos(angle)*R, Math.max(2, Math.sin(angle)*R), 10);
    sun.target.position.set(0,0,0);

    document.getElementById('hourLabel').textContent =
      String(Math.floor(hour)).padStart(2,'0') + ':' + String(Math.floor((hour%1)*60)).padStart(2,'0');
  }

  const hourSlider = document.getElementById('hour');
  hourSlider.addEventListener('input', () => { applyTime(parseFloat(hourSlider.value)); saveWorld(); });

  // ---------------- palette ----------------
  const paletteEl = document.getElementById('palette');
  BLOCK_TYPES.forEach((bt, idx) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (idx===0 ? ' active' : '');
    sw.style.background = '#' + bt.color.toString(16).padStart(6,'0');
    sw.title = bt.name;
    sw.addEventListener('click', () => {
      currentType = idx;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    });
    paletteEl.appendChild(sw);
  });

  // ---------------- mode buttons ----------------
  const buildBtn = document.getElementById('modeBuild');
  const eraseBtn = document.getElementById('modeErase');
  buildBtn.addEventListener('click', () => { mode='build'; buildBtn.classList.add('active'); eraseBtn.classList.remove('active'); });
  eraseBtn.addEventListener('click', () => { mode='erase'; eraseBtn.classList.add('active'); buildBtn.classList.remove('active'); });

  // ---------------- interaction (tap to build/erase) ----------------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downInfo = null;

  function onPointerDown(e){
    const t = e.touches ? e.touches[0] : e;
    downInfo = { x: t.clientX, y: t.clientY, time: Date.now() };
  }
  function onPointerUp(e){
    if(!downInfo) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const dx = t.clientX - downInfo.x, dy = t.clientY - downInfo.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const dt = Date.now() - downInfo.time;
    downInfo = null;
    if(dist > 10 || dt > 350) return; // treat as drag/orbit, not a tap

    pointer.x = (t.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(t.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(instancedMeshes);
    if(hits.length === 0) return;
    const hit = hits[0];
    const typeIdx = hit.object.userData.type;

    if(mode === 'erase'){
      const pos = positionsByType[typeIdx][hit.instanceId];
      if(pos){
        blocks.delete(key(pos[0], pos[1], pos[2]));
        rebuildInstances(); saveWorld();
      }
    } else {
      const n = hit.face.normal;
      const p = hit.point.clone().addScaledVector(n, 0.5);
      const nx = Math.round(p.x - 0.5), ny = Math.round(p.y - 0.5), nz = Math.round(p.z - 0.5);
      const half = GRID/2;
      if(nx < -half || nx >= half || nz < -half || nz >= half || ny < 0 || ny > 24) return;
      if(!blocks.has(key(nx,ny,nz))){
        blocks.set(key(nx,ny,nz), currentType);
        rebuildInstances(); saveWorld();
      }
    }
  }
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  // ---------------- actions ----------------
  document.getElementById('newWorld').addEventListener('click', () => {
    seed = Math.random()*1000;
    generateWorld(); rebuildInstances(); saveWorld();
  });
  document.getElementById('clearWorld').addEventListener('click', () => {
    blocks = new Map(); rebuildInstances(); saveWorld();
  });
  document.getElementById('resetView').addEventListener('click', () => {
    camera.position.copy(defaultCamPos);
    controls.target.set(0,2,0);
    controls.update();
  });

  // ---------------- resize ----------------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------- init ----------------
  const hadSaved = loadWorld();
  if(!hadSaved) generateWorld();
  rebuildInstances();
  applyTime(parseFloat(hourSlider.value));

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  setTimeout(() => {
    document.getElementById('boot').style.opacity = '0';
    setTimeout(() => document.getElementById('boot').remove(), 650);
  }, 400);
  setTimeout(() => {
    const hint = document.getElementById('hint');
    if(hint){ hint.style.opacity='0'; setTimeout(()=>hint.remove(), 600); }
  }, 5000);
})();
</script>
</body>
</html>
