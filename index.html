<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Chronos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --dim: rgba(244,242,236,0.62); --line: rgba(244,242,236,0.16); --panel: rgba(10,10,16,0.62); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04040a; touch-action:none; }
  body{ font-family:'Space Grotesk', sans-serif; color:#F4F2EC; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  canvas{ display:block; }

  .boot{
    position:fixed; inset:0; z-index:200; background:#04040a;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    text-align:center; padding:0 8vw; transition: opacity .8s ease;
  }
  .boot h1{ font-family:'Fraunces', serif; font-weight:300; font-style:italic; font-size:clamp(2.2rem,8vw,3.6rem); margin:0; }
  .boot p{ color:var(--dim); max-width:40ch; line-height:1.7; font-size:0.85rem; }
  .boot button{
    font-family:'JetBrains Mono'; font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase;
    background:#F4F2EC; color:#04040a; border:none; border-radius:999px; padding:16px 36px; cursor:pointer; margin-top:6px;
  }

  .hud-top{
    position:fixed; z-index:20; top: max(16px, env(safe-area-inset-top)); left:16px; right:16px;
    display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none;
  }
  .era-title{ background:var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:16px; padding:12px 18px; pointer-events:all; }
  .era-title .name{ font-family:'Fraunces', serif; font-weight:500; font-size:1.4rem; margin:0; }
  .era-title .tag{ font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); }
  .era-title .years{ font-size:0.7rem; color:var(--dim); margin-top:2px; }

  .spawn-buttons{ display:flex; flex-direction:column; gap:8px; pointer-events:all; }
  .spawn-btn{
    font-family:'JetBrains Mono'; font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase;
    background: var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line); color:#fff;
    border-radius:999px; padding:11px 16px; cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .spawn-btn.active{ background:#F4F2EC; color:#04040a; }

  .toast-stack{ position:fixed; z-index:40; top: max(100px, calc(16px + env(safe-area-inset-top) + 66px)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(90vw, 420px); }
  .toast{
    background: rgba(20,20,28,0.88); backdrop-filter:blur(14px); border:1px solid var(--line);
    border-radius:14px; padding:11px 16px; font-size:0.82rem; text-align:center;
    opacity:0; transform:translateY(-10px); transition: all .35s ease; width:100%;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .placement-hint{
    position:fixed; z-index:20; bottom:158px; left:0; right:0; text-align:center;
    font-size:0.72rem; color:var(--dim); pointer-events:none; transition:opacity .3s ease;
  }

  .timeline-wrap{
    position:fixed; z-index:20; bottom: max(18px, env(safe-area-inset-bottom)); left:16px; right:16px;
    background: var(--panel); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:20px;
    padding: 14px 18px 12px;
  }
  .era-ticks{ display:flex; justify-content:space-between; margin-bottom:6px; }
  .era-tick{ font-size:0.6rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--dim); cursor:pointer; text-align:center; flex:1; }
  .era-tick.active{ color:#fff; font-weight:700; }
  input#timeline{
    width:100%; -webkit-appearance:none; appearance:none; height:5px; border-radius:3px;
    background: linear-gradient(90deg, #FF6B35, #BFD3E3, #C2A66B, #8A8A8F, #2E6F9E);
    outline:none; margin: 8px 0 2px;
  }
  input#timeline::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:3px solid #04040a; cursor:pointer; margin-top:-1px;
  }
</style>
</head>
<body>

<div class="boot" id="boot">
  <h1>Chronos</h1>
  <p>A living globe spanning 230 million years. Drag time forward or back, then tap the surface to spawn a human or a dinosaur — and watch the era decide what happens next.</p>
  <button id="startBtn">Enter</button>
</div>

<div class="hud-top">
  <div class="era-title">
    <div class="name" id="eraName">Mesozoic</div>
    <div class="tag" id="eraTag">Age of Dinosaurs</div>
    <div class="years" id="eraYears">230 – 66 million years ago</div>
  </div>
  <div class="spawn-buttons">
    <button class="spawn-btn" id="spawnHumanBtn">🧍 Spawn Human</button>
    <button class="spawn-btn" id="spawnDinoBtn">🦖 Spawn Dinosaur</button>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>
<div class="placement-hint" id="placementHint" style="opacity:0;">Tap anywhere on the globe to place it</div>

<div class="timeline-wrap">
  <div class="era-ticks" id="eraTicks"></div>
  <input type="range" id="timeline" min="0" max="4" step="1" value="0">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const DEG2RAD = Math.PI/180;
  const R = 5; // globe radius

  // ---------------- era config ----------------
  const ERAS = [
    { id:0, name:'Mesozoic', tag:'Age of Dinosaurs', years:'230 – 66 million years ago',
      color:0x5C7A3F, defenseLevel:0, successChance:0,
      structures:[
        {shape:'cone', count:10, color:0x6B4A2E, hMin:0.6,hMax:1.3, rMin:0.25,rMax:0.45},
        {shape:'cone', count:4,  color:0x8B2E2E, hMin:0.9,hMax:1.4, rMin:0.3,rMax:0.4},
        {shape:'cone', count:14, color:0x3F7D32, hMin:0.2,hMax:0.4, rMin:0.1,rMax:0.16}
      ], ambientCount:3 },
    { id:1, name:'Ice Age', tag:'Glacial Period', years:'2.6 million – 11,700 years ago',
      color:0xBFD3E3, defenseLevel:1, successChance:0.18,
      structures:[
        {shape:'cone', count:16, color:0xE8F0F7, hMin:0.5,hMax:1.1, rMin:0.18,rMax:0.3},
        {shape:'cone', count:8,  color:0x2F3B2A, hMin:0.25,hMax:0.4, rMin:0.1,rMax:0.15}
      ], ambientCount:2 },
    { id:2, name:'Antiquity', tag:'Rise of Civilization', years:'3000 BCE – 500 CE',
      color:0xC2A66B, defenseLevel:2, successChance:0.45,
      structures:[
        {shape:'cone', count:3,  color:0xD8C08A, hMin:0.7,hMax:1.0, rMin:0.35,rMax:0.5},
        {shape:'box',  count:10, color:0xA9835A, hMin:0.25,hMax:0.4, rMin:0.15,rMax:0.2},
        {shape:'box',  count:6,  color:0x9C9C94, hMin:0.4,hMax:0.6, rMin:0.2,rMax:0.28}
      ], ambientCount:3 },
    { id:3, name:'Industrial Era', tag:'Age of Machines', years:'1760 – 1950',
      color:0x8A8A8F, defenseLevel:3, successChance:0.75,
      structures:[
        {shape:'box', count:9, color:0x5C5C63, hMin:0.5,hMax:0.8, rMin:0.2,rMax:0.28},
        {shape:'box', count:8, color:0x6E6E76, hMin:0.8,hMax:1.3, rMin:0.15,rMax:0.2},
        {shape:'cylinder', count:9, color:0x3A3A3E, hMin:0.5,hMax:0.7, rMin:0.05,rMax:0.07}
      ], ambientCount:3 },
    { id:4, name:'Modern Era', tag:'Present Day', years:'2000 — Today',
      color:0x2E6F9E, defenseLevel:5, successChance:0.97,
      structures:[
        {shape:'box', count:16, color:0x8FA8B8, hMin:0.8,hMax:1.8, rMin:0.13,rMax:0.2},
        {shape:'box', count:6,  color:0xC9CFD6, hMin:0.3,hMax:0.5, rMin:0.2,rMax:0.3}
      ], ambientCount:4 }
  ];
  const DEFENDER_STYLE = {
    1: { label:'hunters',  color:0x8B6B4A },
    2: { label:'warriors', color:0xC9A24A },
    3: { label:'soldiers', color:0x5A6B4E },
    4: { label:'armored units', color:0x4A4E58 },
    5: { label:'military forces', color:0x3A4650 }
  };
  const SUCCESS_MESSAGES = {
    1: '🔥 Your hunters scattered in terror — the dinosaur vanished into the ice before anyone could react.',
    2: '⚔️ After a desperate struggle, your warriors drove the beast off with spears and fire.',
    3: '💥 Riflemen and a field cannon brought the creature down after a fierce engagement.',
    4: '🎖️ Armored units neutralized the threat with coordinated fire.',
    5: '🚀 Modern military forces neutralized the dinosaur in minutes with air support.'
  };
  const FAIL_MESSAGES = {
    1: '❄️ The dinosaur shrugged off every spear and vanished into a blizzard.',
    2: '🏚️ The village was overrun — survivors fled as the creature rampaged through, then it wandered off.',
    3: '🚂 It smashed through a rail line before escaping into the countryside.',
    4: '🏙️ It broke through the perimeter and disappeared into the hills before reinforcements arrived.',
    5: '🌆 It evaded interception and vanished into the wilderness — a wild retreat, not a defeat.'
  };

  let currentEraIdx = 0;
  let structureGroup = new THREE.Group();
  let ambientCreatures = [];   // {group,lat,lon,targetLat,targetLon,speed,kind,state,id}
  let activeEntities = [];     // user-spawned human/dinosaur entities
  let spawnMode = null;        // 'human' | 'dinosaur' | null
  let idCounter = 0;

  // ---------------- geo helpers ----------------
  function latLonToVector3(lat, lon, radius){
    const phi = (90-lat) * DEG2RAD;
    const theta = (lon+180) * DEG2RAD;
    return new THREE.Vector3(
      -radius * Math.sin(phi)*Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi)*Math.sin(theta)
    );
  }
  function vector3ToLatLon(v){
    const n = v.clone().normalize();
    const phi = Math.acos(Math.max(-1,Math.min(1,n.y)));
    const lat = 90 - phi*180/Math.PI;
    let thetaDeg = Math.atan2(n.z, -n.x) * 180/Math.PI;
    let lon = thetaDeg - 180;
    if(lon < -180) lon += 360;
    if(lon > 180) lon -= 360;
    return { lat, lon };
  }
  function orientToNormal(obj, normal){
    const up = new THREE.Vector3(0,1,0);
    obj.quaternion.setFromUnitVectors(up, normal.clone().normalize());
  }
  function randLat(){ return Math.asin(2*Math.random()-1) * 180/Math.PI; }
  function randLon(){ return Math.random()*360-180; }

  // ---------------- three.js setup ----------------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 4, 13);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 7;
  controls.maxDistance = 24;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(8,10,6);
  scene.add(sun);

  // starfield
  const starGeo = new THREE.BufferGeometry();
  const starPositions = [];
  for(let i=0;i<1200;i++){
    const r = 60 + Math.random()*40;
    const lat = randLat(), lon = randLon();
    const v = latLonToVector3(lat, lon, r);
    starPositions.push(v.x, v.y, v.z);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.35, transparent:true, opacity:0.7 }));
  scene.add(stars);

  const globeGeo = new THREE.SphereGeometry(R, 48, 48);
  const globeMat = new THREE.MeshStandardMaterial({ color: ERAS[0].color, roughness:0.85, metalness:0.05 });
  const globe = new THREE.Mesh(globeGeo, globeMat);
  scene.add(globe);
  scene.add(structureGroup);

  // ---------------- mesh builders ----------------
  function buildStructureMesh(def){
    const h = def.hMin + Math.random()*(def.hMax-def.hMin);
    const r = def.rMin + Math.random()*(def.rMax-def.rMin);
    let geo;
    if(def.shape === 'cone') geo = new THREE.ConeGeometry(r, h, 7);
    else if(def.shape === 'cylinder') geo = new THREE.CylinderGeometry(r*0.5, r*0.5, h, 8);
    else geo = new THREE.BoxGeometry(r*1.5, h, r*1.5);
    const mat = new THREE.MeshStandardMaterial({ color: def.color, roughness:0.75 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.height = h;
    return mesh;
  }

  function buildCreatureGroup(kind, color){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color, roughness:0.7 });
    if(kind === 'dinosaur'){
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.16,0.16), mat);
      body.position.y = 0.1;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), mat);
      head.position.set(0.22,0.16,0);
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.07,0.26,6), mat);
      tail.rotation.z = Math.PI/2;
      tail.position.set(-0.28,0.1,0);
      g.add(body,head,tail);
    } else if(kind === 'human' || kind === 'villager'){
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.16,6), mat);
      body.position.y = 0.09;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), mat);
      head.position.y = 0.2;
      g.add(body,head);
    } else if(kind === 'mammoth'){
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.2,0.2), mat);
      body.position.y = 0.13;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.11,8,8), mat);
      head.position.set(0.2,0.18,0);
      g.add(body,head);
    } else if(kind === 'hunter' || kind === 'warrior' || kind === 'soldier'){
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.16,6), mat);
      body.position.y = 0.09;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), mat);
      head.position.y = 0.2;
      const spear = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.24,4), mat);
      spear.position.set(0.06,0.14,0);
      spear.rotation.z = -0.3;
      g.add(body,head,spear);
    } else { // armored unit / military
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.09,0.13), mat);
      body.position.y = 0.06;
      const turret = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.05,0.08), mat);
      turret.position.set(0,0.11,0);
      g.add(body,turret);
    }
    return g;
  }

  function placeOnSurface(obj, lat, lon, height){
    const surface = latLonToVector3(lat, lon, R);
    const normal = surface.clone().normalize();
    obj.position.copy(surface.clone().add(normal.clone().multiplyScalar((height||0)/2)));
    orientToNormal(obj, normal);
  }

  function disposeObject(obj){
    obj.traverse(o => {
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
  }

  // ---------------- era population ----------------
  function clearGroup(group){
    while(group.children.length){
      const c = group.children.pop();
      disposeObject(c);
    }
  }

  function populateEra(idx){
    const era = ERAS[idx];
    clearGroup(structureGroup);
    ambientCreatures.forEach(c => scene.remove(c.group));
    ambientCreatures = [];

    era.structures.forEach(def => {
      for(let i=0;i<def.count;i++){
        const mesh = buildStructureMesh(def);
        placeOnSurface(mesh, randLat(), randLon(), mesh.userData.height);
        structureGroup.add(mesh);
      }
    });

    const ambientKind = idx===0 ? 'dinosaur' : idx===1 ? 'mammoth' : idx<=3 ? 'villager' : 'villager';
    const ambientColor = idx===0 ? 0x7A9A4E : idx===1 ? 0x8B7355 : 0xD9B48F;
    for(let i=0;i<era.ambientCount;i++){
      spawnAmbient(ambientKind, ambientColor, randLat(), randLon());
    }

    globeMat.color.setHex(era.color);
    document.getElementById('eraName').textContent = era.name;
    document.getElementById('eraTag').textContent = era.tag;
    document.getElementById('eraYears').textContent = era.years;
    document.querySelectorAll('.era-tick').forEach((el,i) => el.classList.toggle('active', i===idx));
  }

  function spawnAmbient(kind, color, lat, lon){
    const group = buildCreatureGroup(kind, color);
    placeOnSurface(group, lat, lon, 0.16);
    scene.add(group);
    const entity = { id: 'a'+(idCounter++), group, lat, lon, targetLat: lat, targetLon: lon, speed: 3+Math.random()*2, kind, state:'wander' };
    pickNewWanderTarget(entity);
    ambientCreatures.push(entity);
    return entity;
  }
  function pickNewWanderTarget(entity){
    entity.targetLat = Math.max(-80, Math.min(80, entity.lat + (Math.random()-0.5)*24));
    entity.targetLon = entity.lon + (Math.random()-0.5)*24;
  }

  // ---------------- toasts ----------------
  function toast(text){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    stack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(()=>el.remove(), 400); }, 4200);
  }

  // ---------------- particle burst ----------------
  let bursts = [];
  function spawnBurst(position, color){
    const group = new THREE.Group();
    const parts = [];
    for(let i=0;i<16;i++){
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.035,4,4), new THREE.MeshBasicMaterial({ color }));
      mesh.position.copy(position);
      const dir = new THREE.Vector3((Math.random()-0.5),(Math.random()-0.5),(Math.random()-0.5)).normalize();
      parts.push({ mesh, vel: dir.multiplyScalar(0.03+Math.random()*0.04), life:1 });
      group.add(mesh);
    }
    scene.add(group);
    bursts.push({ group, parts });
  }
  function updateBursts(){
    for(let i=bursts.length-1;i>=0;i--){
      const b = bursts[i];
      let alive = false;
      b.parts.forEach(p => {
        p.mesh.position.add(p.vel);
        p.life -= 0.025;
        p.mesh.material.opacity = Math.max(0,p.life);
        p.mesh.material.transparent = true;
        if(p.life > 0) alive = true;
      });
      if(!alive){ disposeObject(b.group); scene.remove(b.group); bursts.splice(i,1); }
    }
  }

  // ---------------- spawn logic ----------------
  function spawnEntity(kind, lat, lon){
    const era = ERAS[currentEraIdx];
    const color = kind==='human' ? 0xE0B98C : 0x7A9A4E;
    const group = buildCreatureGroup(kind, color);
    placeOnSurface(group, lat, lon, 0.16);
    scene.add(group);
    const entity = { id:'e'+(idCounter++), group, lat, lon, kind, targetLat:lat, targetLon:lon, speed:4, state:'idle' };
    activeEntities.push(entity);

    if(kind === 'human'){
      if(era.id === 0){
        const predator = ambientCreatures.find(c => c.kind==='dinosaur');
        if(predator){
          predator.state = 'hunting';
          predator.targetLat = lat; predator.targetLon = lon;
          predator.huntTargetId = entity.id;
          setTimeout(() => {
            const stillThere = activeEntities.find(e => e.id === entity.id);
            if(stillThere){
              scene.remove(stillThere.group); disposeObject(stillThere.group);
              activeEntities = activeEntities.filter(e => e.id !== entity.id);
              spawnBurst(latLonToVector3(lat,lon,R), 0xFF3B30);
              toast('🦖 A predator caught your human!');
            }
            predator.state = 'wander';
            pickNewWanderTarget(predator);
          }, 2200);
        } else {
          toast('🧍 Human settled — no predators nearby right now.');
        }
      } else {
        toast('🧍 Human settled safely into this era.');
      }
    } else if(kind === 'dinosaur'){
      if(era.id === 0){
        entity.state = 'wander';
        ambientCreatures.push(entity);
        activeEntities = activeEntities.filter(e => e.id !== entity.id);
        pickNewWanderTarget(entity);
        toast("🦕 The dinosaur roams freely — it's right at home here.");
      } else {
        const style = DEFENDER_STYLE[era.defenseLevel];
        toast(`⚠️ A dinosaur appeared! ${era.name}'s ${style.label} are mobilizing…`);
        const defenders = [];
        for(let i=0;i<3;i++){
          const dLat = lat + (Math.random()-0.5)*14;
          const dLon = lon + (Math.random()-0.5)*14;
          const dGroup = buildCreatureGroup(style.label.includes('hunter')?'hunter':style.label.includes('warrior')?'warrior':style.label.includes('soldier')?'soldier':'military', style.color);
          placeOnSurface(dGroup, dLat, dLon, 0.16);
          scene.add(dGroup);
          const dEntity = { id:'d'+(idCounter++), group:dGroup, lat:dLat, lon:dLon, targetLat:lat, targetLon:lon, speed:6, state:'converging' };
          defenders.push(dEntity);
          ambientCreatures.push(dEntity);
        }
        setTimeout(() => {
          const success = Math.random() < era.successChance;
          const pos = latLonToVector3(entity.lat, entity.lon, R);
          if(success){
            spawnBurst(pos, 0xFF9800);
            scene.remove(entity.group); disposeObject(entity.group);
            activeEntities = activeEntities.filter(e => e.id !== entity.id);
            toast(SUCCESS_MESSAGES[era.defenseLevel]);
          } else {
            entity.state = 'wander';
            pickNewWanderTarget(entity);
            toast(FAIL_MESSAGES[era.defenseLevel]);
          }
          defenders.forEach(d => {
            ambientCreatures = ambientCreatures.filter(c => c.id !== d.id);
            scene.remove(d.group); disposeObject(d.group);
          });
        }, 2500);
      }
    }
  }

  // ---------------- update loop for wandering/hunting/converging entities ----------------
  function updateCreatures(dt){
    ambientCreatures.forEach(c => {
      const dLat = c.targetLat - c.lat, dLon = c.targetLon - c.lon;
      const dist = Math.hypot(dLat,dLon);
      if(dist > 0.3){
        const step = Math.min(dist, c.speed*dt);
        c.lat += (dLat/dist)*step;
        c.lon += (dLon/dist)*step;
        placeOnSurface(c.group, c.lat, c.lon, 0.16);
      } else if(c.state === 'wander'){
        pickNewWanderTarget(c);
      }
    });
    activeEntities.forEach(e => {
      placeOnSurface(e.group, e.lat, e.lon, 0.16);
    });
  }

  // ---------------- interaction: tap-to-place ----------------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downInfo = null;

  function onDown(e){
    const t = e.touches ? e.touches[0] : e;
    downInfo = { x:t.clientX, y:t.clientY, time:Date.now() };
  }
  function onUp(e){
    if(!downInfo) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const dx = t.clientX-downInfo.x, dy = t.clientY-downInfo.y;
    const dist = Math.hypot(dx,dy);
    const dt = Date.now()-downInfo.time;
    downInfo = null;
    if(dist>10||dt>350||!spawnMode) return;

    pointer.x = (t.clientX/window.innerWidth)*2-1;
    pointer.y = -(t.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(globe);
    if(hits.length === 0) return;
    const { lat, lon } = vector3ToLatLon(hits[0].point);
    spawnEntity(spawnMode, lat, lon);
    setSpawnMode(null);
  }
  renderer.domElement.addEventListener('pointerdown', onDown);
  renderer.domElement.addEventListener('pointerup', onUp);

  function setSpawnMode(mode){
    spawnMode = mode;
    document.getElementById('spawnHumanBtn').classList.toggle('active', mode==='human');
    document.getElementById('spawnDinoBtn').classList.toggle('active', mode==='dinosaur');
    document.getElementById('placementHint').style.opacity = mode ? '1' : '0';
  }
  document.getElementById('spawnHumanBtn').addEventListener('click', () => setSpawnMode(spawnMode==='human' ? null : 'human'));
  document.getElementById('spawnDinoBtn').addEventListener('click', () => setSpawnMode(spawnMode==='dinosaur' ? null : 'dinosaur'));

  // ---------------- timeline ----------------
  const ticksEl = document.getElementById('eraTicks');
  ERAS.forEach((era,i) => {
    const tick = document.createElement('div');
    tick.className = 'era-tick' + (i===0?' active':'');
    tick.textContent = era.name;
    tick.addEventListener('click', () => { document.getElementById('timeline').value = i; changeEra(i); });
    ticksEl.appendChild(tick);
  });
  function changeEra(idx){
    if(idx === currentEraIdx) return;
    currentEraIdx = idx;
    populateEra(idx);
    activeEntities.forEach(e => { scene.remove(e.group); disposeObject(e.group); });
    activeEntities = [];
  }
  document.getElementById('timeline').addEventListener('input', (e) => changeEra(parseInt(e.target.value)));

  // ---------------- resize ----------------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------- init & loop ----------------
  populateEra(0);
  let lastTime = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;
    controls.update();
    updateCreatures(dt);
    updateBursts();
    renderer.render(scene, camera);
  }
  animate(performance.now());

  document.getElementById('startBtn').addEventListener('click', () => {
    const boot = document.getElementById('boot');
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 800);
  });
})();
</script>
</body>
</html>
