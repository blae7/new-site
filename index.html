<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Emergence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050507;
    --panel: rgba(10, 11, 16, 0.55);
    --line: rgba(255,255,255,0.08);
    --text: #E8E6EA;
    --dim: #8B8A96;
    --accent: #7CF6D9;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100%;
    width: 100%;
    touch-action: none;
  }
  canvas{
    display:block;
    position: fixed;
    inset:0;
    width: 100vw;
    height: 100vh;
  }

  .hud{
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }
  .hud-top{
    top: max(20px, env(safe-area-inset-top));
    left: 20px;
    right: 20px;
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .title-block h1{
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0 0 4px 0;
    letter-spacing: 0.01em;
  }
  .title-block .sub{
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .stats{
    text-align: right;
    font-size: 0.7rem;
    color: var(--dim);
    line-height: 1.6;
  }
  .stats b{ color: var(--accent); font-weight: 500; }

  .hud-bottom{
    bottom: max(22px, env(safe-area-inset-bottom));
    left: 20px;
    right: 20px;
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    pointer-events: none;
  }
  .hint{
    font-size: 0.68rem;
    color: var(--dim);
    letter-spacing: 0.04em;
    max-width: 30ch;
    line-height: 1.5;
  }
  .controls{
    display:flex;
    gap: 8px;
    pointer-events: all;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  button{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  button:active{
    background: rgba(124, 246, 217, 0.15);
    border-color: var(--accent);
    transform: scale(0.96);
  }

  .boot{
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    transition: opacity 0.8s ease;
  }
  .boot p{
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .boot .dot{
    width: 6px; height:6px; border-radius:50%;
    background: var(--accent);
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:0.2;} 50%{opacity:1;} }
</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="dot"></div>
  <p>initializing organism…</p>
</div>

<canvas id="c"></canvas>

<div class="hud hud-top">
  <div class="title-block">
    <h1>Emergence</h1>
    <div class="sub">A self-organizing particle ecosystem</div>
  </div>
  <div class="stats" id="stats">
    gen <b id="gen">1</b><br>
    <span id="count">0</span> particles<br>
    <span id="fps">0</span> fps
  </div>
</div>

<div class="hud hud-bottom">
  <div class="hint">Touch and hold to draw particles toward you. Rules are random each generation — no two organisms behave the same.</div>
  <div class="controls">
    <button id="btnChaos">Perturb</button>
    <button id="btnRegen">New Organism</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- Particle Life engine ----------
  const TYPES = 5;
  const COLORS = ['#FF5C7A', '#7CF6D9', '#F2C14E', '#8B7FD1', '#5EC2FF'];
  const RMAX = 90;              // interaction radius (in CSS px, scaled by DPR at draw)
  const FRICTION = 0.82;
  const FORCE_SCALE = 0.9;
  const isSmall = window.innerWidth < 700;
  const COUNT = isSmall ? 420 : 700;

  let particles = [];
  let matrix = [];
  let generation = 1;

  function randomMatrix(){
    const m = [];
    for(let i=0;i<TYPES;i++){
      m.push([]);
      for(let j=0;j<TYPES;j++){
        m[i].push( (Math.random() * 2 - 1) );
      }
    }
    return m;
  }

  function spawn(){
    particles = [];
    for(let i=0;i<COUNT;i++){
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: 0, vy: 0,
        t: Math.floor(Math.random() * TYPES)
      });
    }
  }

  function regenerate(){
    matrix = randomMatrix();
    generation++;
    document.getElementById('gen').textContent = generation;
    spawn();
  }

  // Particle-life force curve (normalized r in [0,1])
  function forceFn(r, a){
    const beta = 0.28;
    if(r < beta){
      return r / beta - 1;
    } else if(r < 1){
      return a * (1 - Math.abs(2*r - 1 - beta) / (1 - beta));
    }
    return 0;
  }

  // pointer interaction
  let pointer = { x: -9999, y: -9999, active: false };

  function step(){
    const cw = window.innerWidth, ch = window.innerHeight;
    const cellSize = RMAX;
    const cols = Math.ceil(cw / cellSize) + 2;
    const rows = Math.ceil(ch / cellSize) + 2;
    const grid = new Array(cols * rows);
    for(let i=0;i<grid.length;i++) grid[i] = [];

    function cellIndex(x,y){
      const cx = Math.max(0, Math.min(cols-1, Math.floor(x/cellSize)+1));
      const cy = Math.max(0, Math.min(rows-1, Math.floor(y/cellSize)+1));
      return cy*cols+cx;
    }
    for(let i=0;i<particles.length;i++){
      grid[cellIndex(particles[i].x, particles[i].y)].push(i);
    }

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      let fx = 0, fy = 0;
      const cx = Math.max(0, Math.min(cols-1, Math.floor(p.x/cellSize)+1));
      const cy = Math.max(0, Math.min(rows-1, Math.floor(p.y/cellSize)+1));

      for(let gx=-1; gx<=1; gx++){
        for(let gy=-1; gy<=1; gy++){
          const nx = cx+gx, ny = cy+gy;
          if(nx<0||nx>=cols||ny<0||ny>=rows) continue;
          const bucket = grid[ny*cols+nx];
          for(let k=0;k<bucket.length;k++){
            const j = bucket[k];
            if(j===i) continue;
            const q = particles[j];
            const dx = q.x - p.x, dy = q.y - p.y;
            const d = Math.sqrt(dx*dx+dy*dy);
            if(d>0 && d<RMAX){
              const r = d / RMAX;
              const a = matrix[p.t][q.t];
              const f = forceFn(r, a) * FORCE_SCALE;
              fx += (dx/d) * f;
              fy += (dy/d) * f;
            }
          }
        }
      }

      // pointer attraction
      if(pointer.active){
        const dx = pointer.x - p.x, dy = pointer.y - p.y;
        const d = Math.sqrt(dx*dx+dy*dy) || 1;
        if(d < 260){
          fx += (dx/d) * 0.5;
          fy += (dy/d) * 0.5;
        }
      }

      p.vx = (p.vx + fx) * FRICTION;
      p.vy = (p.vy + fy) * FRICTION;
      p.x += p.vx;
      p.y += p.vy;

      // wrap edges
      if(p.x < -10) p.x = cw+10;
      if(p.x > cw+10) p.x = -10;
      if(p.y < -10) p.y = ch+10;
      if(p.y > ch+10) p.y = -10;
    }
  }

  function draw(){
    ctx.fillStyle = 'rgba(5,5,7,0.28)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x*DPR, p.y*DPR, 2.1*DPR, 0, Math.PI*2);
      ctx.fillStyle = COLORS[p.t];
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  let lastTime = performance.now();
  let frames = 0, fpsTimer = 0;

  function loop(now){
    const dt = now - lastTime;
    lastTime = now;
    frames++; fpsTimer += dt;
    if(fpsTimer > 500){
      document.getElementById('fps').textContent = Math.round(frames / (fpsTimer/1000));
      frames = 0; fpsTimer = 0;
    }
    step();
    draw();
    requestAnimationFrame(loop);
  }

  // pointer events
  function setPointer(e, active){
    const t = e.touches ? e.touches[0] : e;
    if(t){
      pointer.x = t.clientX;
      pointer.y = t.clientY;
    }
    pointer.active = active;
  }
  canvas.addEventListener('pointerdown', e => setPointer(e, true));
  canvas.addEventListener('pointermove', e => { if(pointer.active) setPointer(e, true); });
  canvas.addEventListener('pointerup', e => setPointer(e, false));
  canvas.addEventListener('pointercancel', e => setPointer(e, false));
  canvas.addEventListener('pointerleave', e => setPointer(e, false));

  document.getElementById('btnRegen').addEventListener('click', regenerate);
  document.getElementById('btnChaos').addEventListener('click', () => {
    for(const p of particles){
      p.vx += (Math.random()-0.5) * 14;
      p.vy += (Math.random()-0.5) * 14;
    }
  });

  document.getElementById('count').textContent = COUNT;

  // init
  regenerate();
  requestAnimationFrame(loop);

  setTimeout(() => {
    const boot = document.getElementById('boot');
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 850);
  }, 700);
})();
</script>

</body>
</html>
