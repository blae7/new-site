<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Resonance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --dim: rgba(255,255,255,0.55); --line: rgba(255,255,255,0.14); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
  canvas{ display:block; position:fixed; inset:0; }
  body{ font-family:'JetBrains Mono', monospace; color:#fff; }

  .boot{
    position:fixed; inset:0; z-index:100; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    transition: opacity 1s ease; text-align:center; padding: 0 10vw;
  }
  .boot h1{
    font-family:'Fraunces', serif; font-weight:300; font-style:italic;
    font-size: clamp(2.2rem, 8vw, 3.6rem); margin:0; letter-spacing:0.01em;
  }
  .boot p{ color: var(--dim); font-size:0.78rem; letter-spacing:0.06em; line-height:1.7; max-width:36ch; }
  .boot button{
    font-family:'JetBrains Mono'; font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase;
    background: transparent; border:1px solid rgba(255,255,255,0.4); color:#fff;
    border-radius: 999px; padding:16px 36px; cursor:pointer; margin-top:8px;
    transition: all .25s ease;
  }
  .boot button:active{ background: rgba(255,255,255,0.15); }

  .hint{
    position:fixed; top: max(24px, env(safe-area-inset-top)); left:0; right:0;
    text-align:center; z-index:10; pointer-events:none;
    font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--dim);
    transition: opacity 1.2s ease;
  }

  .ui{
    position:fixed; z-index:10; bottom: max(20px, env(safe-area-inset-bottom));
    left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:14px;
    pointer-events:none;
  }
  .scales{ display:flex; gap:8px; pointer-events:all; }
  .scale-btn{
    font-family:'JetBrains Mono'; font-size:0.65rem; letter-spacing:0.06em; text-transform:uppercase;
    background: rgba(255,255,255,0.06); border:1px solid var(--line); color: var(--dim);
    border-radius:999px; padding:9px 15px; cursor:pointer; backdrop-filter: blur(10px);
  }
  .scale-btn.active{ background:#fff; color:#000; border-color:#fff; }
  .icon-row{ display:flex; gap:10px; pointer-events:all; }
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background: rgba(255,255,255,0.06); border:1px solid var(--line); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter: blur(10px);
  }
  .flash{
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50;
    transition: opacity 0.15s ease;
  }
</style>
</head>
<body>

<div class="boot" id="boot">
  <h1>Resonance</h1>
  <p>Touch the screen. Every stroke paints light and plays a note — nothing you play can sound wrong. Tilt the iPad to stir the wind.</p>
  <button id="startBtn">Begin</button>
</div>

<div class="hint" id="hint">touch and drag to play &nbsp;·&nbsp; hold multiple fingers for chords</div>

<canvas id="c"></canvas>
<div class="flash" id="flash"></div>

<div class="ui">
  <div class="scales">
    <button class="scale-btn active" data-scale="pentatonic">Pentatonic</button>
    <button class="scale-btn" data-scale="lydian">Lydian</button>
    <button class="scale-btn" data-scale="minor">Minor</button>
    <button class="scale-btn" data-scale="wholetone">Whole-tone</button>
  </div>
  <div class="icon-row">
    <button class="icon-btn" id="muteBtn" title="Mute">🔊</button>
    <button class="icon-btn" id="saveBtn" title="Save snapshot">⬇</button>
    <button class="icon-btn" id="clearBtn" title="Clear canvas">✕</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = window.innerWidth * DPR;
    H = canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------------- scales ----------------
  const SCALES = {
    pentatonic: [0,2,4,7,9],
    lydian: [0,2,4,6,7,9,11],
    minor: [0,2,3,5,7,8,10],
    wholetone: [0,2,4,6,8,10]
  };
  let currentScale = 'pentatonic';
  const ROOT = 220; // A3
  const OCTAVE_RANGE = 3;

  function freqForY(yNorm){ // yNorm: 0 (top) = high, 1 (bottom) = low
    const scale = SCALES[currentScale];
    const totalSteps = scale.length * OCTAVE_RANGE;
    const stepFloat = (1 - yNorm) * totalSteps;
    const stepIdx = Math.round(stepFloat);
    const octave = Math.floor(stepIdx / scale.length);
    const degree = scale[((stepIdx % scale.length) + scale.length) % scale.length];
    const semitone = octave*12 + degree;
    return ROOT * Math.pow(2, semitone/12);
  }

  document.querySelectorAll('.scale-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentScale = btn.dataset.scale;
    });
  });

  // ---------------- wind (device tilt) ----------------
  let wind = { x: 0, y: 0 };
  function handleOrientation(e){
    const gamma = (e.gamma || 0) / 45;  // left-right
    const beta = ((e.beta || 0) - 30) / 45; // front-back, offset for natural hold angle
    wind.x = Math.max(-1, Math.min(1, gamma)) * 0.035;
    wind.y = Math.max(-1, Math.min(1, beta)) * 0.035;
  }

  // ---------------- particles ----------------
  let particles = [];
  function spawnParticles(x, y, hue, count){
    for(let i=0;i<count;i++){
      particles.push({
        x: x + (Math.random()-0.5)*6,
        y: y + (Math.random()-0.5)*6,
        vx: (Math.random()-0.5)*0.6,
        vy: (Math.random()-0.5)*0.6,
        hue: hue + (Math.random()-0.5)*20,
        life: 1,
        decay: 0.004 + Math.random()*0.006,
        size: (2 + Math.random()*3) * DPR
      });
    }
  }
  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx += wind.x; p.vy += wind.y;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * DPR; p.y += p.vy * DPR;
      p.life -= p.decay;
      if(p.life <= 0 || p.x<0||p.x>W||p.y<0||p.y>H) particles.splice(i,1);
    }
  }
  function drawParticles(){
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for(const p of particles){
      const alpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${alpha})`;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------------- audio engine ----------------
  let actx, master, delayNode, feedbackGain, wetGain, muted = false;
  const voices = new Map(); // pointerId -> { osc, filter, gain }

  function initAudio(){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.8;

    delayNode = actx.createDelay(2.0);
    delayNode.delayTime.value = 0.32;
    feedbackGain = actx.createGain();
    feedbackGain.gain.value = 0.38;
    wetGain = actx.createGain();
    wetGain.gain.value = 0.5;

    delayNode.connect(feedbackGain);
    feedbackGain.connect(delayNode);
    delayNode.connect(wetGain);
    wetGain.connect(actx.destination);

    master.connect(actx.destination);
    master.connect(delayNode);

    startDrone();
  }

  function startDrone(){
    [ROOT/2, ROOT/2 * Math.pow(2,7/12)].forEach((f, i) => {
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = actx.createGain();
      g.gain.value = 0.05;
      const lfo = actx.createOscillator();
      lfo.frequency.value = 0.05 + i*0.02;
      const lfoGain = actx.createGain();
      lfoGain.gain.value = 0.015;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
    });
  }

  function hueForX(xNorm){ return xNorm * 300; }

  function noteOn(id, xNorm, yNorm){
    if(!actx) return;
    const freq = freqForY(yNorm);
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400 + xNorm*3000;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(0, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.22, actx.currentTime + 0.04);
    osc.connect(filter); filter.connect(gain); gain.connect(master);
    osc.start();
    voices.set(id, { osc, filter, gain });
  }
  function noteUpdate(id, xNorm, yNorm){
    const v = voices.get(id);
    if(!v) return;
    const freq = freqForY(yNorm);
    v.osc.frequency.linearRampToValueAtTime(freq, actx.currentTime + 0.08);
    v.filter.frequency.linearRampToValueAtTime(400 + xNorm*3000, actx.currentTime + 0.08);
  }
  function noteOff(id){
    const v = voices.get(id);
    if(!v) return;
    v.gain.gain.cancelScheduledValues(actx.currentTime);
    v.gain.gain.setValueAtTime(v.gain.gain.value, actx.currentTime);
    v.gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.5);
    v.osc.stop(actx.currentTime + 0.55);
    voices.delete(id);
  }

  // ---------------- pointer handling ----------------
  function handleDown(e){
    if(actx && actx.state === 'suspended') actx.resume();
    const xNorm = e.clientX / window.innerWidth;
    const yNorm = e.clientY / window.innerHeight;
    noteOn(e.pointerId, xNorm, yNorm);
    spawnParticles(e.clientX*DPR, e.clientY*DPR, hueForX(xNorm), 18);
  }
  function handleMove(e){
    if(!voices.has(e.pointerId)) return;
    const xNorm = e.clientX / window.innerWidth;
    const yNorm = e.clientY / window.innerHeight;
    noteUpdate(e.pointerId, xNorm, yNorm);
    spawnParticles(e.clientX*DPR, e.clientY*DPR, hueForX(xNorm), 4);
  }
  function handleUp(e){
    noteOff(e.pointerId);
  }
  canvas.addEventListener('pointerdown', handleDown);
  canvas.addEventListener('pointermove', handleMove);
  canvas.addEventListener('pointerup', handleUp);
  canvas.addEventListener('pointercancel', handleUp);
  canvas.addEventListener('pointerleave', handleUp);

  // ---------------- UI buttons ----------------
  document.getElementById('muteBtn').addEventListener('click', (e) => {
    muted = !muted;
    if(master) master.gain.value = muted ? 0 : 0.8;
    e.target.textContent = muted ? '🔇' : '🔊';
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    particles = [];
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
  });
  document.getElementById('saveBtn').addEventListener('click', () => {
    const flash = document.getElementById('flash');
    flash.style.opacity = '0.7';
    setTimeout(() => flash.style.opacity = '0', 150);
    const a = document.createElement('a');
    a.download = 'resonance-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  // ---------------- loop ----------------
  function loop(){
    updateParticles();
    drawParticles();
    requestAnimationFrame(loop);
  }
  loop();

  // ---------------- boot / start ----------------
  function playConfirmChime(){
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 660;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(0.35, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
    osc.connect(g); g.connect(master);
    osc.start();
    osc.stop(actx.currentTime + 0.65);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    // Safari/iPadOS sometimes leaves the context suspended even after a user gesture — force it awake.
    actx.resume().then(() => { playConfirmChime(); }).catch(() => { playConfirmChime(); });
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(state => {
        if(state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
    const boot = document.getElementById('boot');
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 1000);
  });

  setTimeout(() => {
    const hint = document.getElementById('hint');
    if(hint) hint.style.opacity = '0';
  }, 6000);
})();
</script>
</body>
</html>
